[package]
authors = ["WillBooster Inc."]
autoexamples = false
categories = ["parser-implementations", "parsing", "text-editors"]
description = "XML & DTD grammars for tree-sitter"
edition = "2024"
keywords = ["incremental", "parsing", "tree-sitter", "xml", "dtd"]
license = "MIT"
name = "willbooster-tree-sitter-xml"
readme = "README.md"
repository = "https://github.com/WillBooster/tree-sitter-xml"
version = "0.0.0"

build = "bindings/rust/build.rs"
include = [
  "/bindings/rust/*",
  "/common/*",
  "/xml/grammar.js",
  "/xml/src/*",
  "!/xml/src/.gitattributes",
  "!/xml/src/.editorconfig",
  "/dtd/grammar.js",
  "/dtd/src/*",
  "!/dtd/src/.gitattributes",
  "!/dtd/src/.editorconfig",
  "/queries/*",
  "/tree-sitter.json",
  "/LICENSE",
]

[lib]
name = "tree_sitter_xml"
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1.6"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = { package = "willbooster-tree-sitter", version = "15.0.0" }
